name: run

on:
  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:

jobs:
  fetch-pgm-maps:
    runs-on: ubuntu-latest
    environment: run
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !*.obj
            !*.mtl
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: checkout map fetcher
        uses: actions/checkout@v6
        with:
          repository: MCResourcePile/map-fetcher
          path: "./map-fetcher"

      - name: checkout textures
        uses: actions/checkout@v6
        with:
          repository: PixiGeko/Minecraft-default-assets
          path: "./map-fetcher/textures"

      - name: install dependencies
        run: |
          cd ./map-fetcher
          npm install

      - name: execute script
        run: |
          cd ./map-fetcher
          node src/overview.js --source="${GITHUB_WORKSPACE}/sources.json" --output="${GITHUB_WORKSPACE}" --textures="${GITHUB_WORKSPACE}/map-fetcher/textures"
        env:
          JMC2OBJVERSION: ${{ vars.JMC2OBJVERSION }}

      - name: remove temp files
        run: |
          rm -r ./map-fetcher

      - name: commit changes
        if: github.event_name != 'pull_request'
        uses: EndBug/add-and-commit@v9
        with:
          message: Update map objects
          add: '. --sparse'
